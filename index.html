<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ocean Sailing Simulator</title>
<style>
  :root { color-scheme:dark; --view-top:0px; --view-height:100dvh; --keyboard-inset:0px; --controls-bottom:108px; --instruments-bottom:92px; --ink:#f3eee3; --muted:#b8c4c7; --gold:#edbd78; --glass:#101d25e8; }

  button,input,select,summary { touch-action:manipulation; }

  .has-looked #look-hint { display:none; }
  @keyframes hint-away { to { opacity:0; } }
  #panel,#boat-panel,#captain-panel,#landfall-panel,#camera-panel,#performance-panel { position:fixed; right:max(12px,env(safe-area-inset-right)); top:var(--controls-bottom); width:350px; max-height:calc(var(--view-top) + var(--view-height) - var(--controls-bottom) - 118px); display:flex; flex-direction:column; overflow:hidden; box-sizing:border-box; border:1px solid #ffffff30; border-radius:10px; background:#101d25f5; z-index:7; box-shadow:0 12px 40px #0005; }

  #panel label { display:grid; grid-template-columns:minmax(0,1fr) 104px 30px; gap:5px; align-items:center; min-height:36px; }
  #panel input[type=range] { width:100%; min-width:0; accent-color:var(--gold); }
  #panel output { text-align:right; font-size:11px; color:var(--muted); }
  #panel #astronomy-controls .astronomy-date-control { grid-template-columns:minmax(0,1fr); gap:6px; padding:6px 0; }

  .gunnery-actions button { flex:1; padding:8px 6px; font-size:12px; }

  #crew-status { color:var(--gold); }
  #crew-roster { padding-left:18px; }
  #crew-roster li { margin:8px 0; }

  #captain-panel details { margin-top:12px; }
  #share-panel { position:fixed; right:12px; top:var(--controls-bottom); z-index:7; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; width:350px; max-width:calc(100vw - 16px); box-sizing:border-box; background:#101d25f5; padding:12px; border:1px solid #ffffff30; border-radius:10px; }
  #share-panel input { width:100%; min-width:0; }
  #share-panel [role=status] { grid-column:1/-1; font-size:12px; color:var(--muted); }
  #panel .resolution-control { display:flex; flex-wrap:wrap; justify-content:space-between; margin:8px 0; gap:6px; }
  #render-resolution { max-width:100%; }
  #resolution-status { font-size:11px; color:var(--muted); }
  #gpu-profile { border:1px solid #ffffff24; border-radius:6px; margin-bottom:8px; font:10px/1.5 ui-monospace,monospace; }
  #gpu-profile summary { padding:0 8px; }
  #gpu-profile pre { margin:0; padding:0 8px 8px; max-height:160px; overflow:auto; white-space:pre-wrap; }
  #performance-summary { margin:0 0 10px; font:11px/1.5 ui-monospace,monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
  .performance-open #hud { display:none; }
  .landfall-stages,.landfall-weather { display:flex; flex-wrap:wrap; gap:5px; }
  .landfall-stages button,.landfall-weather button { flex:1; padding:7px; }
  #landfall-panel p { font-size:12px; }
  #landfall-chart svg { width:100%; display:block; background:#142c39; border-radius:5px; }
  #landfall-panel .landfall-credit { font-size:11px; color:var(--muted); }
  #landfall-ocean { margin-top:10px; }
  #anchor-status { color:var(--gold); font-size:12px; }
  #environment-debug,#voice-controls { border-top:1px solid #ffffff20; margin-top:12px; padding-top:6px; }
  #environment-debug p,#voice-controls p { color:var(--muted); font-size:11px; }
  #panel #environment-debug label,#panel #voice-controls label { display:flex; justify-content:space-between; gap:8px; }
  #panel #environment-debug input[type=checkbox] { width:20px; }
  .encounter-buttons { display:flex; flex-wrap:wrap; gap:5px; }
  .encounter-buttons button { flex:1; }
  #encounter-notice { position:fixed; top:calc(var(--controls-bottom) + 8px); left:50%; transform:translateX(-50%); max-width:calc(100vw - 30px); padding:8px 12px; border:1px solid #ffffff30; border-radius:7px; background:var(--glass); font-size:12px; color:var(--gold); z-index:4; pointer-events:none; box-sizing:border-box; }
  @media (max-width:720px), (pointer:coarse) {
    #sailing-instruments { top:calc(var(--view-top) + max(8px,env(safe-area-inset-top))); left:50%; transform:translateX(-50%); width:344px; }
    .instrument-heading,.instrument-speed { padding:6px 9px 4px; }
    .instrument-heading { flex-basis:70px; }
    .instrument-speed { flex-basis:100px; }
    .instrument-wind .instrument-label { font-size:7px; letter-spacing:.03em; }
    #sailing-heading,#sailing-knots { font-size:21px; }
    .instrument-wind { padding:4px 8px 4px 0; }
    .instrument-wind svg { width:40px; height:40px; }
    #sailing-cue { padding:3px 9px; font-size:9px; }
    #camera-dock { top:calc(var(--instruments-bottom) + 6px); right:50%; transform:translateX(50%); justify-content:center; width:max-content; max-width:calc(100vw - 8px); gap:4px; }
    .icon-button { width:44px; height:44px; min-height:44px; padding:12px; }
    #camera-dock > button { border-radius:9px; }
    #helm-controls { bottom:calc(var(--keyboard-inset) + max(8px,env(safe-area-inset-bottom))); max-width:calc(100vw - 16px); width:400px; grid-template-columns:1fr; gap:7px; padding:8px 10px; }
    .helm-label { margin-bottom:2px; font-size:10px; }
    .helm-label output { font-size:10px; }
    #boat-rudder { height:44px; }
    .sail-buttons button { height:44px; padding:6px; }
    #look-hint { bottom:164px; font-size:10px; }
    #hud { bottom:166px; font-size:9px; }
    #panel,#boat-panel,#captain-panel,#landfall-panel,#camera-panel,#performance-panel { top:var(--controls-bottom); left:max(8px,env(safe-area-inset-left)); right:max(8px,env(safe-area-inset-right)); width:auto; max-height:calc(var(--view-top) + var(--view-height) - var(--controls-bottom) - max(8px,env(safe-area-inset-bottom))); }
    .share-open #helm-controls,.sea-settings-open #helm-controls,.ship-settings-open #helm-controls,.captain-open #helm-controls,.landfall-open #helm-controls,.camera-open #helm-controls,.performance-open #helm-controls { visibility:hidden; }
    .panel-body { padding:8px 12px 12px; }
    #panel label { min-height:40px; grid-template-columns:minmax(0,1fr) minmax(75px,34%) 30px; }
    #panel input[type=range],#sail-controls input[type=range] { height:40px; }
    input[type=number],input[type=url],input[type=datetime-local],select { font-size:16px; min-height:40px; }
    #boat-panel label { min-height:40px; }
    #boat-panel input[type=number] { width:90px; }
    .panel-body button,summary { min-height:44px; }
    #share-panel { right:8px; }
  }
  @media (max-width:360px) { #camera-dock { gap:0; } }
  @media (max-height:480px) and (min-width:640px) {

    #camera-dock { top:calc(var(--view-top) + max(8px,env(safe-area-inset-top))); right:max(8px,env(safe-area-inset-right)); transform:none; max-width:calc(100vw - 334px); }
    .icon-button { width:44px; height:44px; min-height:44px; }
    .sail-buttons button { height:44px; }
    #helm-controls { width:520px; grid-template-columns:1.35fr 1fr; gap:14px; }

<body>
<div id="ocean-startup" data-state="loading" data-stage="module" role="dialog" aria-modal="true" aria-labelledby="ocean-startup-title" aria-describedby="ocean-startup-stage" tabindex="-1">
  <div class="ocean-startup-card">
    <p class="ocean-startup-name">OCEAN SAILING SIMULATOR</p>
    <h1 id="ocean-startup-title">Preparing to sail</h1>
    <p id="ocean-startup-stage" role="status" aria-live="polite" aria-atomic="true">Loading the sailing simulation…</p>
    <div class="ocean-startup-bar" role="progressbar" aria-label="Loading the sailing scene"><span></span></div>
    <p id="ocean-startup-hint" role="status" aria-live="polite" hidden>Still preparing the scene. Graphics setup and large models can take longer on a first visit.</p>
    <button id="ocean-startup-retry" type="button" hidden>Retry</button>
  </div>
</div>
<script>
(() => {
  const oceanBootOverlay=document.getElementById('ocean-startup');
  const oceanBootTitle=document.getElementById('ocean-startup-title');
  const oceanBootStage=document.getElementById('ocean-startup-stage');
  const oceanBootHint=document.getElementById('ocean-startup-hint');
  const oceanBootRetry=document.getElementById('ocean-startup-retry');
  let oceanBootState='loading';
  const oceanBootMark=name=>{if(window.performance?.mark)performance.mark('ocean-startup-'+name);};
  const oceanBootTimer=setTimeout(()=>{if(oceanBootState==='loading')oceanBootHint.hidden=false;},10000);
  const oceanBootError=event=>{
    if(oceanBootState!=='loading')return;
    if(event.target instanceof HTMLScriptElement)window.oceanStartup.fail('The sailing simulation could not be loaded. Check your connection and retry.');
    else if(event instanceof ErrorEvent)window.oceanStartup.fail(event.error||event.message||'The sailing simulation could not start.');
  };
  const oceanBootRejection=event=>{if(oceanBootState==='loading')window.oceanStartup.fail(event.reason);};
  const oceanBootKeyboard=event=>{
    if(oceanBootState==='ready')return;
    event.stopImmediatePropagation();
    if(event.key==='Tab'){event.preventDefault();(oceanBootState==='failed'?oceanBootRetry:oceanBootOverlay).focus();}
  };
  window.oceanStartup=Object.freeze({
    get state(){return oceanBootState;},
    stage(name,label){
      if(oceanBootState!=='loading')return;
      oceanBootOverlay.dataset.stage=name;oceanBootStage.textContent=label;oceanBootMark(name);
    },
    ready(){
      if(oceanBootState!=='loading')return;
      oceanBootState='ready';oceanBootOverlay.dataset.state='ready';clearTimeout(oceanBootTimer);oceanBootMark('ready');
      const oceanBootHadFocus=oceanBootOverlay.contains(document.activeElement);oceanBootOverlay.hidden=true;
      removeEventListener('error',oceanBootError,true);removeEventListener('unhandledrejection',oceanBootRejection);removeEventListener('keydown',oceanBootKeyboard,true);
      if(oceanBootHadFocus)document.getElementById('c')?.focus({preventScroll:true});
    },
    fail(error){
      if(oceanBootState!=='loading')return;
      oceanBootState='failed';oceanBootOverlay.dataset.state='failed';clearTimeout(oceanBootTimer);oceanBootMark('failed');
      oceanBootTitle.textContent='Unable to set sail';oceanBootStage.setAttribute('role','alert');oceanBootStage.setAttribute('aria-live','assertive');
      oceanBootStage.textContent=error?.message||String(error||'The sailing simulation could not start.');
      oceanBootHint.hidden=true;oceanBootRetry.hidden=false;oceanBootRetry.focus();
    },
  });
  oceanBootRetry.addEventListener('click',()=>location.reload());
  addEventListener('error',oceanBootError,true);addEventListener('unhandledrejection',oceanBootRejection);addEventListener('keydown',oceanBootKeyboard,true);
  oceanBootMark('bootstrap');oceanBootOverlay.focus({preventScroll:true});
})();
</script>
<canvas id="c" tabindex="-1" aria-label="Ocean sailing scene"></canvas>
<div id="hud">
  <div id="fps">starting…</div>
  <div class="help">click: mouse look · WASD move · Space/E up · Q/C down · Shift fast · wheel speed · H panel</div>
</div>
<div id="panel" class="hidden"></div>
<div id="err"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
